name: Main workflow
'on':
  push:
    branches:
    - main
  pull_request: null
  pull_request_target:
    types:
    - labeled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    if: 'github.event_name == ''push'' ||

      github.event_name == ''pull_request'' ||

      (github.event_name == ''pull_request_target'' && github.event.label.name ==
      ''safe-to-deploy'')

      '
    timeout-minutes: 20
    strategy:
      matrix:
        environment:
        - empty
        - development
    environment:
      name: ${{ matrix.environment }}
    env:
      DATABASE_URL: postgres://
      AUTH_SECRET: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: ./.github/actions/submodules-checkout
      with:
        submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Pnpm install
      run: 'pnpm install

        '
    - uses: actions/cache@v4
      with:
        path: './node_modules/.cache/prettier/.prettier-cache

          '
        key: checks-${{ github.sha }}
        restore-keys: checks-
    - run: echo ===SHA USED=== ${{ github.event.pull_request.head.sha || github.sha
        }}
    - run: 'pnpm prettier --cache --check "**/*.{js,md,ts,tsx}"

        '
    - name: Lint
      run: 'pnpm lint

        '
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: 'playwright-${{ runner.os }}-

          '
    - name: Playwright init
      run: 'pnpm playwright install

        '
      working-directory: packages/sdk-components-animation
    - name: Test
      run: 'pnpm -r test

        '
    - name: Typecheck
      run: 'pnpm -r typecheck

        '
  check-size:
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: ./.github/actions/submodules-checkout
      with:
        submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}
    - uses: ./.github/actions/ci-setup
    - run: pnpm --filter "{./fixtures/*}..." build
    - uses: actions/github-script@v7
      with:
        script: "const assertSize = async (directory, maxSize) => {\n  let result\
          \ = ''\n  await exec.exec('du', ['-sk', directory], {\n    silent: true,\n\
          \    listeners: {\n      stdout: (data) => {\n        result += data.toString()\n\
          \      }\n    }\n  })\n  const size = Number.parseInt(result, 10)\n  return\
          \ {\n    passed: size <= maxSize,\n    size,\n    diff: size - maxSize,\n\
          \    directory,\n  }\n}\nconst results = [\n  await assertSize('./fixtures/ssg-cloudflare-pages/dist/client',\
          \ 356),\n  await assertSize('./fixtures/react-router-netlify/build/client',\
          \ 376),\n  await assertSize('./fixtures/webstudio-features/build/client',\
          \ 3312),\n]\nfor (const result of results) {\n  if (result.passed) {\n \
          \   console.info(`${result.directory}: ${result.size}kB (${result.diff}kB)`)\n\
          \  } else {\n    console.info('')\n    console.error(`${result.directory}:\
          \ ${result.size}kB (+${result.diff}kB)`)\n  }\n}\nif (results.some(result\
          \ => result.passed === false)) {\n  console.error('Some fixtures exceeded\
          \ limits')\n  process.exit(1)\n}\n"
